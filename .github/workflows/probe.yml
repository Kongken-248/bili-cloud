name: probe

# 一次性探针 workflow：验证本仓库的 schedule 定时触发是否工作。
# 与生产 bili.yml 完全隔离：无 push 触发（推送本文件不会引起任何运行），
# 无并发组、无权限、只 echo 一行。cron 只在每年 11-9 UTC 16:55 触发，无残留风险。
# 结论得出后整个删除。
on:
  schedule:
    - cron: '30 17 9 11 *'   # 2026-11-10 01:30 北京 = 11-09 17:30 UTC
  workflow_dispatch: {}       # 手动触发做对照实验：文件本身有效，排除语法问题

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: echo "probe fired at $(date -u '+%F %T') UTC"
