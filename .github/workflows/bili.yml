name: bili-cloud

# 云端只做两件事：全库数值快照 + newlist 扩样（新视频仅元数据）。
# 不采弹幕正文、不采评论正文 —— 那两个需要登录态，留在本地。
on:
  schedule:
    - cron: '0 1,13 * * *'      # 01:00 / 13:00 UTC = 09:00 / 21:00 北京时间
  push:
    branches: [main]            # 推送即跑（测试 / 清单更新后）；产出 commit 带 [skip ci] 防自触发
  workflow_dispatch:
    inputs:
      limit:
        description: '只跑前 N 个（dry-run 用，0 = 全部）'
        default: '0'
      mode:
        description: 'snapshot / expand / both'
        default: 'both'

permissions:
  contents: write

concurrency:
  group: bili-cloud
  cancel-in-progress: false

jobs:
  # 先生成统一批次标签：4 个分片必须共用一个 collect_time，
  # 否则一轮会被拆成 4 个假批次，快照面板就废了。
  prep:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.t.outputs.tag }}
    steps:
      - id: t
        run: |
          echo "tag=$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M')" >> "$GITHUB_OUTPUT"

  snap:
    needs: prep
    if: ${{ github.event.inputs.mode != 'expand' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: snapshot shard ${{ matrix.shard }}
        env:
          LIMIT: ${{ github.event.inputs.limit || '0' }}
          TAG: ${{ needs.prep.outputs.tag }}
        run: |
          python cloud/run.py --mode snapshot \
            --shard ${{ matrix.shard }} --total 4 \
            --tag "$TAG" --limit "${LIMIT:-0}"
      - uses: actions/upload-artifact@v4
        with:
          name: snap-${{ matrix.shard }}
          path: out/
          if-no-files-found: error

  expand:
    needs: prep
    if: ${{ github.event.inputs.mode != 'snapshot' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: expand newlist
        env:
          LIMIT: ${{ github.event.inputs.limit || '0' }}
          TAG: ${{ needs.prep.outputs.tag }}
        run: |
          python cloud/run.py --mode expand \
            --tag "$TAG" --limit "${LIMIT:-0}"
      - uses: actions/upload-artifact@v4
        with:
          name: expand
          path: out/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: bvids
          path: data/bvids.json
          if-no-files-found: error

  commit:
    needs: [snap, expand]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: snap-*
          merge-multiple: true
          path: out
        continue-on-error: true     # 分片全挂时没有产物，不能让 commit 步骤跟着报错
      - uses: actions/download-artifact@v4
        with:
          name: expand
          path: out
        continue-on-error: true
      - uses: actions/download-artifact@v4
        with:
          name: bvids
          path: data
        continue-on-error: true

      - name: commit
        run: |
          git config user.name  "bili-cloud-bot"
          git config user.email "bot@users.noreply.github.com"
          mkdir -p out                     # 采集全挂时 out/ 不存在，git add 会直接报错
          git add -A
          if git diff --cached --quiet; then
            echo "本轮无新数据"
            exit 0
          fi
          # [skip ci] 防自触发：本 workflow 有 push 触发，产出 commit 若再触发会死循环
          git commit -m "cloud $(TZ=Asia/Shanghai date '+%F %T') [skip ci]"
          git pull --rebase
          git push

      - name: summary
        run: |
          echo "### 本批产出" >> "$GITHUB_STEP_SUMMARY"
          python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import glob, json
          for p in sorted(glob.glob("out/*.json")):
              d = json.load(open(p, encoding="utf-8"))
              print(f"- `{p}` 批次 {d.get('batch')} 快照 {len(d.get('snapshots') or [])} "
                    f"视频 {len(d.get('videos') or [])} 失败 {len(d.get('failed') or [])}")
          EOF
