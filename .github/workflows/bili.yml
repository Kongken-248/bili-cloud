name: bili-cloud

# 云端只做两件事：全库数值快照 + newlist 扩样（新视频仅元数据）。
# 不采弹幕正文、不采评论正文 —— 那两个需要登录态，留在本地。
#
# 定时触发（2026-11-10 起）：外部定时服务 cron-job.org 准点调用 workflow_dispatch
# API 拉起本 workflow，是唯一定时主路径。GitHub 原生 schedule 已于同日退役：
# 两天内 5 个定时点全部静默未触发（独立探针对照实验已排除本仓库配置问题，
# 定论为 GitHub 平台调度器不可靠），证据链见《GitHub_Actions部署操作手册》。
on:
  push:
    branches: [main]            # 推送即跑（测试 / 清单更新后）；产出 commit 带 [skip ci] 防自触发
  workflow_dispatch:
    inputs:
      limit:
        description: '每个分片只跑前 N 个（dry-run 用，0 = 全部）'
        default: '0'
      mode:
        description: 'snapshot / expand / both'
        default: 'both'

permissions:
  contents: write

concurrency:
  group: bili-cloud
  cancel-in-progress: false

jobs:
  # 先生成统一批次标签：4 个分片必须共用一个 collect_time，
  # 否则一轮会被拆成 4 个假批次，快照面板就废了。
  prep:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.t.outputs.tag }}
    steps:
      - id: t
        run: |
          echo "tag=$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M')" >> "$GITHUB_OUTPUT"

  snap:
    needs: prep
    if: ${{ github.event.inputs.mode != 'expand' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: snapshot shard ${{ matrix.shard }}
        env:
          LIMIT: ${{ github.event.inputs.limit || '0' }}
          TAG: ${{ needs.prep.outputs.tag }}
        run: |
          python cloud/run.py --mode snapshot \
            --shard ${{ matrix.shard }} --total 4 \
            --tag "$TAG" --limit "${LIMIT:-0}"
      - uses: actions/upload-artifact@v4
        with:
          name: snap-${{ matrix.shard }}
          path: out/
          if-no-files-found: error

  expand:
    needs: prep
    if: ${{ github.event.inputs.mode != 'snapshot' }}
    runs-on: ubuntu-latest
    # 扩样已降级为"只发现不跟踪"（2026-11-10）：新视频只记分区+元数据+首次计数，
    # 不追加进跟踪清单。防重复靠 data/discovered.json 发现登记簿。
    # 实测 25.2 分钟（256 个新视频 × 3 请求 + 24 次 newlist）。原来是 30 分钟，
    # 余量只剩 5 分钟，新视频一多就会踩线，放宽到 45。
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: expand newlist
        env:
          LIMIT: ${{ github.event.inputs.limit || '0' }}
          TAG: ${{ needs.prep.outputs.tag }}
        run: |
          python cloud/run.py --mode expand \
            --tag "$TAG" --limit "${LIMIT:-0}"
      - uses: actions/upload-artifact@v4
        with:
          name: expand
          path: out/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: bvids
          path: data/*.json          # bvids.json（固定跟踪面板）+ discovered.json（发现登记簿）
          if-no-files-found: error

  commit:
    needs: [snap, expand]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: snap-*
          merge-multiple: true
          path: out
        continue-on-error: true     # 分片全挂时没有产物，不能让 commit 步骤跟着报错
      - uses: actions/download-artifact@v4
        with:
          name: expand
          path: out
        continue-on-error: true
      - uses: actions/download-artifact@v4
        with:
          name: bvids
          path: data
        continue-on-error: true

      - name: commit
        run: |
          git config user.name  "bili-cloud-bot"
          git config user.email "bot@users.noreply.github.com"
          mkdir -p out                     # 采集全挂时 out/ 不存在，git add 会直接报错
          git add -A
          if git diff --cached --quiet; then
            echo "本轮无新数据"
            exit 0
          fi
          # [skip ci] 防自触发：本 workflow 有 push 触发，产出 commit 若再触发会死循环
          git commit -m "cloud $(TZ=Asia/Shanghai date '+%F %T') [skip ci]"
          if git push; then exit 0; fi
          # 推送被拒 = 采集运行期间有人向 main 推过提交（2026-11-09 实际发生过，导致整轮数据丢失）。
          # 恢复办法：重置到最新远端，重放本轮产物。out/*.json 文件名含批次时间戳，天然不冲突；
          # bvids.json 是追加型清单，与远端求并集后重新提交。
          git fetch origin main
          rm -rf /tmp/keep && mkdir -p /tmp/keep
          cp -r out /tmp/keep/out
          cp data/bvids.json /tmp/keep/bvids.json
          git reset --hard origin/main
          mkdir -p out && cp -r /tmp/keep/out/. out/
          python - <<'PY'
          import json
          remote = json.load(open('data/bvids.json'))
          ours   = json.load(open('/tmp/keep/bvids.json'))
          merged = sorted(set(remote) | set(ours))
          json.dump(merged, open('data/bvids.json', 'w'), ensure_ascii=False, indent=0)
          print(f"bvids 并集合并: 远端 {len(remote)} + 本轮 {len(ours)} -> {len(merged)}")
          PY
          git add -A
          git commit -m "cloud $(TZ=Asia/Shanghai date '+%F %T') [skip ci]"
          git push

      - name: summary
        run: |
          echo "### 本批产出" >> "$GITHUB_STEP_SUMMARY"
          python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import glob, json
          for p in sorted(glob.glob("out/*.json")):
              d = json.load(open(p, encoding="utf-8"))
              print(f"- `{p}` 批次 {d.get('batch')} 快照 {len(d.get('snapshots') or [])} "
                    f"视频 {len(d.get('videos') or [])} 失败 {len(d.get('failed') or [])}")
          EOF
